# SPDX-License-Identifier: Apache-2.0
name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ontele
          POSTGRES_PASSWORD: ontele
          POSTGRES_DB: ontele
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ontele" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://ontele:ontele@localhost:5432/ontele
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: ffmpeg (for media tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - name: validate deploy manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          KC="./kubeconform -strict -summary -ignore-missing-schemas -schema-location default -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          $KC deploy/k8s/*.yaml
          cp deploy/.env.example deploy/.env.ci
          sed -i 's/^OAUTH2_PROXY_CLIENT_ID=$/OAUTH2_PROXY_CLIENT_ID=x/; s/^OAUTH2_PROXY_CLIENT_SECRET=$/OAUTH2_PROXY_CLIENT_SECRET=y/; s/^OAUTH2_PROXY_COOKIE_SECRET=$/OAUTH2_PROXY_COOKIE_SECRET=z/' deploy/.env.ci
          docker compose --env-file deploy/.env.ci -f deploy/docker-compose.yml config --quiet
          docker compose --env-file deploy/.env.ci -f deploy/docker-compose.yml -f deploy/docker-compose.dev-idp.yml config --quiet
      - name: helm chart
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.3
      - run: |
          set -o pipefail
          KC="./kubeconform -strict -summary -ignore-missing-schemas -schema-location default -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          helm lint deploy/helm/ontele
          helm template ci deploy/helm/ontele -n media --set persistence.media.hostPath=/media --set dex.enabled=true \
            | $KC
          helm template ci deploy/helm/ontele -n media --set persistence.media.existingClaim=pvc --set oauth2Proxy.enabled=false \
            --set config.auth=none --set postgresql.enabled=false --set externalDatabase.url=postgres://u:p@db/x \
            --set loki.enabled=false --set promtail.enabled=false --set prometheus.enabled=false --set grafana.enabled=false \
            --set ingress.enabled=false --set httpRoute.enabled=true --set httpRoute.parentRefs[0].name=shared-gw \
            | $KC
          helm template ci deploy/helm/ontele -n media --set persistence.media.hostPath=/media \
            --set ingress.enabled=false --set gateway.enabled=true --set gateway.address=192.168.1.240 --set dex.enabled=true \
            --set gateway.tls.secretName=edge-tls | $KC
