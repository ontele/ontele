# Ship logs with Grafana Alloy instead of Promtail (Promtail reached
# end-of-life on 2026-03-02; Alloy is its supported successor). Same Loki
# labels, same dashboard.
#
#   docker compose -f docker-compose.yml -f docker-compose.alloy.yml up -d
#   (combine with docker-compose.dev-idp.yml for the zero-config trial)

services:
  promtail:
    profiles: ["promtail"]   # parked: only starts with --profile promtail

  alloy:
    image: grafana/alloy:v1.18.1
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    depends_on: [loki]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks: [backend]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  alloy-data:
