# SPDX-License-Identifier: Apache-2.0
# Ships every compose container's stdout to Loki. Ontele logs JSON lines, so
# we lift a few bounded-cardinality fields (level, target, kind) into labels
# and keep the rest as structured metadata for `| json`.
server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=ontele"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: app
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
    pipeline_stages:
      - match:
          selector: '{app="ontele"}'
          stages:
            - json:
                expressions:
                  level: level
                  target: target
                  kind: kind
                  status: status
                  route: route
            - labels:
                level:
                target:
            - structured_metadata:
                kind:
                status:
                route:
            - timestamp:
                source: timestamp
                format: RFC3339Nano
                fallback_formats: ["RFC3339"]
