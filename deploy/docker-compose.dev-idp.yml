# SPDX-License-Identifier: Apache-2.0
# Zero-config trial: adds a bundled OpenID Connect provider (Dex) with two
# static users and points oauth2-proxy at it, so no Google/GitHub/Authentik
# setup is needed. Identity still flows exactly as in production
# (browser → oauth2-proxy → X-Forwarded-Email → Ontele / Grafana).
#
#   docker compose -f docker-compose.yml -f docker-compose.dev-idp.yml up -d --build
#   open http://localhost:4180          → sign in as admin@example.com / password
#                                         (viewer@example.com / password is a non-admin)
#
# Dex listens on http://localhost:5556 for the browser; oauth2-proxy talks to
# it as http://dex:5556 on the compose network, hence the split URLs below.

services:
  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "5556:5556"
    networks: [backend, edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5556/dex/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  oauth2-proxy:
    depends_on:
      dex:
        condition: service_healthy
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: "Ontele (local users)"
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://localhost:5556/dex
      # the browser and the proxy reach Dex via different hostnames
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: http://localhost:5556/dex/auth
      OAUTH2_PROXY_REDEEM_URL: http://dex:5556/dex/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://dex:5556/dex/keys
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
      OAUTH2_PROXY_APPROVAL_PROMPT: auto   # let Dex honour skipApprovalScreen
      OAUTH2_PROXY_CLIENT_ID: ontele
      OAUTH2_PROXY_CLIENT_SECRET: ontele-dev-secret
      OAUTH2_PROXY_COOKIE_SECRET: dev-only-cookie-secret-32bytes!!
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:4180/oauth2/callback

  ontele:
    environment:
      ONTELE_ADMIN_USERS: ${ONTELE_ADMIN_USERS:-admin@example.com}
