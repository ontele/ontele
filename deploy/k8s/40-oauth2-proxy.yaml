# The only thing exposed by the Ingress. One login for Ontele (/) and
# Grafana (/grafana/); identity is forwarded as X-Forwarded-* headers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-config
  namespace: ontele
data:
  OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
  OAUTH2_PROXY_PROVIDER: oidc
  OAUTH2_PROXY_OIDC_ISSUER_URL: https://accounts.google.com
  OAUTH2_PROXY_EMAIL_DOMAINS: "*"
  OAUTH2_PROXY_REDIRECT_URL: https://ontele.example.com/oauth2/callback
  OAUTH2_PROXY_SCOPE: "openid email profile"
  OAUTH2_PROXY_COOKIE_NAME: _ontele
  OAUTH2_PROXY_COOKIE_SECURE: "true"
  OAUTH2_PROXY_COOKIE_EXPIRE: 168h
  OAUTH2_PROXY_COOKIE_REFRESH: 1h
  OAUTH2_PROXY_PASS_USER_HEADERS: "true"
  OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
  OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
  OAUTH2_PROXY_PREFER_EMAIL_TO_USER: "false"   # prefer-email would drop X-Forwarded-Email
  OAUTH2_PROXY_UPSTREAMS: "http://ontele:7979/,http://grafana:3000/grafana/"
  OAUTH2_PROXY_SKIP_AUTH_ROUTES: "^/healthz$,^/readyz$"
  OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
  OAUTH2_PROXY_REVERSE_PROXY: "true"
  OAUTH2_PROXY_UPSTREAM_TIMEOUT: 0s
  OAUTH2_PROXY_FLUSH_INTERVAL: 100ms
  OAUTH2_PROXY_SILENCE_PING_LOGGING: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: ontele
  labels:
    app.kubernetes.io/name: oauth2-proxy
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: ontele
  labels:
    app.kubernetes.io/name: oauth2-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
          ports:
            - name: http
              containerPort: 4180
          envFrom:
            - configMapRef:
                name: oauth2-proxy-config
            - secretRef:
                name: oauth2-proxy
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ontele
  namespace: ontele
  annotations:
    # long-lived HLS/live connections
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 16m
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    cert-manager.io/cluster-issuer: letsencrypt   # remove if you don't run cert-manager
spec:
  ingressClassName: nginx
  tls:
    - hosts: [ontele.example.com]
      secretName: ontele-tls
  rules:
    - host: ontele.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  name: http
