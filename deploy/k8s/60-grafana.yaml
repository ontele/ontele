# SPDX-License-Identifier: Apache-2.0
# Grafana behind the same oauth2-proxy (auth proxy headers), served at /grafana/.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-env
  namespace: ontele
data:
  GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
  GF_SERVER_SERVE_FROM_SUB_PATH: "true"
  GF_AUTH_PROXY_ENABLED: "true"
  GF_AUTH_PROXY_HEADER_NAME: X-Forwarded-Email
  GF_AUTH_PROXY_HEADER_PROPERTY: email
  GF_AUTH_PROXY_HEADERS: "Name:X-Forwarded-Preferred-Username"
  GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
  GF_AUTH_PROXY_WHITELIST: "0.0.0.0/0"
  GF_AUTH_DISABLE_LOGIN_FORM: "true"
  GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
  GF_SECURITY_ADMIN_USER: admin
  GF_ANALYTICS_REPORTING_ENABLED: "false"
  GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
  GF_NEWS_NEWS_FEED_ENABLED: "false"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: ontele
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ontele
  labels:
    app.kubernetes.io/name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ontele
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:12.4.9
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: grafana-env
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana
                  key: admin-password
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          readinessProbe:
            httpGet:
              path: /grafana/api/health
              port: http
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
