{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ontele.component" (dict "root" . "name" "grafana") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontele.componentLabels" (dict "root" . "component" "grafana") | nindent 4 }}
spec:
  selector:
    {{- include "ontele.selectorLabels" (dict "root" . "component" "grafana") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
{{- end }}
