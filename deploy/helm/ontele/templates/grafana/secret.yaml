{{- if and .Values.grafana.enabled (not .Values.grafana.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ontele.component" (dict "root" . "name" "grafana") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontele.componentLabels" (dict "root" . "component" "grafana") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  admin-password: {{ default (include "ontele.generated" (dict "root" . "key" "__grafanaAdmin" "secret" (include "ontele.component" (dict "root" . "name" "grafana")) "field" "admin-password")) .Values.grafana.adminPassword | quote }}
{{- end }}
