{{- if .Values.loki.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ontele.component" (dict "root" . "name" "loki") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontele.componentLabels" (dict "root" . "component" "loki") | nindent 4 }}
spec:
  selector:
    {{- include "ontele.selectorLabels" (dict "root" . "component" "loki") | nindent 4 }}
  ports:
    - name: http
      port: 3100
      targetPort: http
{{- end }}
