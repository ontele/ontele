{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ontele.component" (dict "root" . "name" "postgresql") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontele.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  serviceName: {{ include "ontele.component" (dict "root" . "name" "postgresql") }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "ontele.selectorLabels" (dict "root" . "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ontele.selectorLabels" (dict "root" . "component" "postgresql") | nindent 8 }}
    spec:
      {{- include "ontele.imagePullSecrets" . | nindent 6 }}
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ include "ontele.postgresql.secretName" . }}
          volumeMounts:
            # PG18 image layout: PGDATA defaults to /var/lib/postgresql/18/docker
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "ontele.storageClassName" (dict "root" $ "local" .Values.postgresql.persistence.storageClass) | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
{{- end }}
