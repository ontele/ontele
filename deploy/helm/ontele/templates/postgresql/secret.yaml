{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ontele.component" (dict "root" . "name" "postgresql") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontele.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
  annotations:
    # keep the generated password across `helm uninstall` + reinstall of the same release name
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  POSTGRES_PASSWORD: {{ include "ontele.postgresql.password" . | quote }}
{{- end }}
