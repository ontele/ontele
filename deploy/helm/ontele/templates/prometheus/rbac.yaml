{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ontele.component" (dict "root" . "name" "prometheus") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontele.componentLabels" (dict "root" . "component" "prometheus") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ontele.component" (dict "root" . "name" "prometheus") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontele.componentLabels" (dict "root" . "component" "prometheus") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ontele.component" (dict "root" . "name" "prometheus") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontele.componentLabels" (dict "root" . "component" "prometheus") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ontele.component" (dict "root" . "name" "prometheus") }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "ontele.component" (dict "root" . "name" "prometheus") }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
