{{- if and .Values.oauth2Proxy.enabled (not .Values.oauth2Proxy.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ontele.component" (dict "root" . "name" "oauth2-proxy") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontele.componentLabels" (dict "root" . "component" "oauth2-proxy") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if .Values.dex.enabled }}
  OAUTH2_PROXY_CLIENT_ID: ontele
  OAUTH2_PROXY_CLIENT_SECRET: {{ .Values.dex.clientSecret | quote }}
  {{- else }}
  OAUTH2_PROXY_CLIENT_ID: {{ required "oauth2Proxy.clientId is required (or set oauth2Proxy.existingSecret / enable dex)" .Values.oauth2Proxy.clientId | quote }}
  OAUTH2_PROXY_CLIENT_SECRET: {{ required "oauth2Proxy.clientSecret is required (or set oauth2Proxy.existingSecret / enable dex)" .Values.oauth2Proxy.clientSecret | quote }}
  {{- end }}
  OAUTH2_PROXY_COOKIE_SECRET: {{ include "ontele.oauth2Proxy.cookieSecret" . | quote }}
{{- end }}
