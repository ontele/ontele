apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ontele.fullname" . }}-test-connection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontele.componentLabels" (dict "root" . "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: curlimages/curl:8.12.1
      command: ["sh", "-ec"]
      args:
        - |
          curl -fsS http://{{ include "ontele.fullname" . }}:{{ .Values.service.port }}/healthz
          curl -fsS http://{{ include "ontele.fullname" . }}:{{ .Values.service.port }}/readyz
          # identity is enforced: no headers → 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://{{ include "ontele.fullname" . }}:{{ .Values.service.port }}/api/me)" = "{{ if eq .Values.config.auth "proxy" }}401{{ else }}200{{ end }}"
          {{- if .Values.oauth2Proxy.enabled }}
          curl -fsS http://{{ include "ontele.component" (dict "root" . "name" "oauth2-proxy") }}:4180/ping
          {{- end }}
